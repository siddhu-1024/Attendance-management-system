<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Classroom Attendance & Timetable System | Portal Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>

<body class="login-page">

    <div class="login-container">
        <div class="login-card">
            
            <div class="login-header">
                <div class="brand-badge">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
                        <path d="M6 12v5c3 3 9 3 12 0v-5"/>
                    </svg>
                </div>
                <h1>Smart Classroom</h1>
                <p class="subtitle">Academic Attendance & Period Management System</p>
                <div class="dept-tag">Department of Computer Science & AI (CAI)</div>
            </div>

            <!-- LOGIN MODE TABS (CTPO & STUDENT ONLY) -->
            <div class="login-mode-tabs">
                <button type="button" class="mode-tab-btn active" id="tabCtpoBtn" onclick="switchLoginMode('ctpo')">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <span>CTPO Login</span>
                </button>
                <button type="button" class="mode-tab-btn" id="tabStudentBtn" onclick="switchLoginMode('student')">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
                        <path d="M6 12v5c3 3 9 3 12 0v-5"/>
                    </svg>
                    <span>Student Login</span>
                </button>
            </div>

            {% if error %}
            <div class="alert alert-danger" id="loginAlert">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <!-- FORM -->
            <form action="/api/login" method="POST" id="loginForm" class="login-form">
                <input type="hidden" name="login_type" id="loginTypeInput" value="ctpo">

                <!-- CTPO LOGIN FIELDS -->
                <div id="ctpoFieldsGroup">
                    <div class="form-group">
                        <label for="username">CTPO Username / ID</label>
                        <div class="input-wrapper">
                            <input
                                type="text"
                                name="username"
                                id="username"
                                title="CTPO Username"
                                aria-label="CTPO Username"
                                placeholder="Enter CTPO username (e.g. ctpo)"
                                autocomplete="username"
                                required
                            >
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="input-wrapper">
                            <input
                                type="password"
                                name="password"
                                id="password"
                                title="Password"
                                aria-label="Password"
                                placeholder="Enter password"
                                autocomplete="current-password"
                                required
                            >
                            <button type="button" class="btn-toggle-pwd" id="togglePasswordBtn" title="Toggle password visibility" aria-label="Toggle password visibility">
                                <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- STUDENT SPECIFIC FIELDS -->
                <div id="studentFieldsGroup" class="hidden">
                    <div class="student-helper-note">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="12" y1="16" x2="12" y2="12"></line>
                            <line x1="12" y1="8" x2="12.01" y2="8"></line>
                        </svg>
                        <span>For student login, enter your <strong>Roll Number</strong> as both your Username and Password.</span>
                    </div>

                    <div class="form-group">
                        <label for="studentRoll">Student Roll Number (Username)</label>
                        <div class="input-wrapper">
                            <input
                                type="text"
                                id="studentRoll"
                                name="studentRoll"
                                title="Student Roll Number"
                                aria-label="Student Roll Number"
                                placeholder="e.g., 256Q1A4317 or 25B21A4376"
                                autocomplete="username"
                            >
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="studentPassword">Password (Roll Number)</label>
                        <div class="input-wrapper">
                            <input
                                type="password"
                                id="studentPassword"
                                name="studentPassword"
                                title="Password (Roll Number)"
                                aria-label="Password (Roll Number)"
                                placeholder="Enter your Roll Number"
                                autocomplete="current-password"
                            >
                            <button type="button" class="btn-toggle-pwd" id="toggleStudentPasswordBtn" title="Toggle password visibility" aria-label="Toggle password visibility">
                                <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-block btn-lg" id="loginSubmitBtn">
                    <span id="submitBtnText">Sign In to CTPO Portal</span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </button>

            </form>

            <div class="login-footer">
                <div class="system-version">Smart Classroom Portal • Academic Session 2026-27</div>
            </div>

        </div>
    </div>

    <script>
        let currentMode = 'ctpo';

        function switchLoginMode(mode) {
            currentMode = mode;
            const ctpoBtn = document.getElementById('tabCtpoBtn');
            const studentBtn = document.getElementById('tabStudentBtn');
            const ctpoFields = document.getElementById('ctpoFieldsGroup');
            const studentFields = document.getElementById('studentFieldsGroup');
            const loginTypeInput = document.getElementById('loginTypeInput');
            const submitBtnText = document.getElementById('submitBtnText');
            
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const studentRollInput = document.getElementById('studentRoll');
            const studentPasswordInput = document.getElementById('studentPassword');

            if (mode === 'student') {
                ctpoBtn.classList.remove('active');
                studentBtn.classList.add('active');
                ctpoFields.classList.add('hidden');
                studentFields.classList.remove('hidden');
                loginTypeInput.value = 'student';
                submitBtnText.textContent = 'Sign In to Student Portal';
                
                usernameInput.required = false;
                passwordInput.required = false;
                studentRollInput.required = true;
                studentPasswordInput.required = true;
                
                studentRollInput.focus();
            } else {
                studentBtn.classList.remove('active');
                ctpoBtn.classList.add('active');
                studentFields.classList.add('hidden');
                ctpoFields.classList.remove('hidden');
                loginTypeInput.value = 'ctpo';
                submitBtnText.textContent = 'Sign In to CTPO Portal';
                
                usernameInput.required = true;
                passwordInput.required = true;
                studentRollInput.required = false;
                studentPasswordInput.required = false;
                
                usernameInput.focus();
            }
        }

        // Toggle CTPO password visibility
        document.getElementById('togglePasswordBtn').addEventListener('click', function () {
            const pwdInput = document.getElementById('password');
            const isPassword = pwdInput.type === 'password';
            pwdInput.type = isPassword ? 'text' : 'password';
            this.classList.toggle('active', isPassword);
        });

        // Toggle Student password visibility
        document.getElementById('toggleStudentPasswordBtn').addEventListener('click', function () {
            const pwdInput = document.getElementById('studentPassword');
            const isPassword = pwdInput.type === 'password';
            pwdInput.type = isPassword ? 'text' : 'password';
            this.classList.toggle('active', isPassword);
        });
    </script>
</body>
</html>
